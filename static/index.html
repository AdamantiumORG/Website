<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adamantium</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="development-banner top-bar">
        <span>
            ⚠ Adamantium is currently in heavy development
        </span>
    </div>

    <main>
        <h1>Adamantium</h1>

        <p>
            A simple and powerful programming language.
        </p>

        <div class="buttons">
            <a href="/docs" class="button primary">
                Get Started
            </a>

            <a
                href="https://github.com/AdamantiumORG/Adamantium"
                class="button"
                target="_blank"
                rel="noopener noreferrer"
            >
                Source Code
            </a>

            <a href="/download" class="button download">
                Download
            </a>

            <a
                href="https://github.com/AdamantiumORG/Adamantium/issues"
                class="button issue"
                target="_blank"
                rel="noopener noreferrer"
            >
                Issues
            </a>
        </div>
    </main>

</body>
</html>
